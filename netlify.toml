[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The main Content-Security-Policy is a <meta> tag in each HTML page, because the account page needs to
# allow Telegram's login widget and Netlify merges overlapping header rules into one header. The header
# only adds directives that a <meta> CSP cannot express.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200
