<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Parkzettel bot avatar. Telegram shows it as a circle: everything important stays inside r=400. -->
  <rect width="1024" height="1024" fill="#f7ba0b"/>
  <g fill="#1e1e1e">
    <!-- three QR finder patterns, as on the favicon -->
    <g id="finder">
      <rect x="236" y="236" width="200" height="200" rx="34"/>
      <rect x="276" y="276" width="120" height="120" rx="18" fill="#f7ba0b"/>
      <rect x="306" y="306" width="60" height="60" rx="10"/>
    </g>
    <use href="#finder" x="352"/>
    <use href="#finder" y="352"/>
    <!-- speech bubble where the fourth corner's data modules would be: the sticker that talks back -->
    <path d="M620 588h168a34 34 0 0 1 34 34v112a34 34 0 0 1-34 34h-96l-62 52v-52h-10a34 34 0 0 1-34-34V622a34 34 0 0 1 34-34z"/>
    <g fill="#f7ba0b">
      <circle cx="660" cy="678" r="16"/><circle cx="704" cy="678" r="16"/><circle cx="748" cy="678" r="16"/>
    </g>
  </g>
</svg>
