<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Scanner and generator pages: no third-party code. connect-src also allows Netlify's Real User Monitoring
         collector, whose script Netlify injects at /.netlify/scripts/rum. Header-only directives live in netlify.toml. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://ingesteer.services-prod.nsvcs.net https://netlify-rum.netlify.app" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f7ba0b" />
    <meta name="description" content="A QR sticker for your car. Whoever you block in scans it and reaches you by call, WhatsApp, Telegram or a private message, without your number on the windshield. Free, no app." />
    <!-- Link previews (WhatsApp, Telegram, social). Absolute URLs: update them if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parkzettel" />
    <meta property="og:url" content="https://parkzettel.netlify.app/" />

    <meta property="og:description" content="A QR sticker for your car. Whoever you block in scans it and reaches you, without your number on the windshield. Free, no app." />

    <meta property="og:image:alt" content="Parkzettel sticker with a QR code and the headline Blocking you?" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Parkzettel</title>

</html>
